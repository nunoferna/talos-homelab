name: Static checks

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete history
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        # gitleaks/gitleaks-action v3
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  configuration:
    name: Configuration validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        # actions/setup-python v6
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Lint YAML
        run: yamllint .
      - name: Check Ansible syntax
        working-directory: management/ansible
        run: |
          for playbook in discover prepare-artifacts stage activate stop test-proxy runner recovery-tools; do
            ansible-playbook --syntax-check "${playbook}.yaml"
          done
          ansible-playbook --syntax-check recovery-runner-tools.yaml
          ansible-playbook --syntax-check recovery-github-environments.yaml
          ansible-playbook --syntax-check talos-backup-access-preview.yaml
      - name: Compile Python
        run: >-
          python -m py_compile
          tests/proxy_dhcp_isolated.py
          tests/public_manifests.py
          tests/recovery_poc.py
          tests/private_sync.py
          tests/external_secrets.py
          tests/rook_preparation.py
      - name: Reject plaintext public Secrets
        run: python tests/public_manifests.py
      - name: Render the public Flux root
        run: kubectl kustomize clusters/homelab > /tmp/homelab.yaml
      - name: Render the inactive upstream Talos backup configuration
        run: kubectl kustomize platform/backup/talos > /tmp/talos-backup.yaml
      - name: Verify the inactive one-shot recovery PoC
        run: python tests/recovery_poc.py
      - name: Verify the bounded private-repository bridge
        run: python tests/private_sync.py
      - name: Verify the disconnected backup reconciliation preparation
        run: python tests/backup_sync.py
      - name: Prepare checksum-pinned offline Helm renderer and ESO chart
        env:
          ESO_CHECK_DIR: ${{ runner.temp }}/eso-offline-check
          ESO_RELEASE_URL: https://github.com/external-secrets/external-secrets/releases/download/helm-chart-2.11.0
        run: |
          mkdir -p "$ESO_CHECK_DIR"
          curl --fail --silent --show-error --location \
            https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz \
            --output "$ESO_CHECK_DIR/helm.tar.gz"
          printf '%s  %s\n' \
            '86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb' \
            "$ESO_CHECK_DIR/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$ESO_CHECK_DIR/helm.tar.gz" -C "$ESO_CHECK_DIR" linux-amd64/helm
          printf '%s\n' "$ESO_CHECK_DIR/linux-amd64" >> "$GITHUB_PATH"
          curl --fail --silent --show-error --location \
            "$ESO_RELEASE_URL/external-secrets-2.11.0.tgz" \
            --output "$ESO_CHECK_DIR/external-secrets.tgz"
      - name: Verify the empty namespace-scoped ESO chart on Kubernetes 1.37
        env:
          ESO_CHART_ARCHIVE: ${{ runner.temp }}/eso-offline-check/external-secrets.tgz
        run: python tests/external_secrets.py
      - name: Fetch the Rook operator chart for offline preparation checks
        env:
          ROOK_CHART_ARCHIVE: ${{ runner.temp }}/eso-offline-check/rook-ceph.tgz
        run: |
          curl --fail --silent --show-error --location \
            https://charts.rook.io/release/rook-ceph-1.21.0.tgz \
            --output "$ROOK_CHART_ARCHIVE"
      - name: Verify disconnected Rook preparation without CSI or disk claims
        env:
          ROOK_CHART_ARCHIVE: ${{ runner.temp }}/eso-offline-check/rook-ceph.tgz
        run: python tests/rook_preparation.py
      - name: Exercise native preview guards with synthetic client doubles
        run: bash tests/backup_access_preview.sh

  opentofu:
    name: OpenTofu validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up OpenTofu
        # opentofu/setup-opentofu v2
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4
        with:
          tofu_version: 1.12.6
      - name: Check formatting
        run: tofu fmt -check -diff -recursive infrastructure
      - name: Initialize roots without remote backends
        run: |
          tofu -chdir=infrastructure/talos init -backend=false -input=false
          tofu -chdir=infrastructure/cilium init -backend=false -input=false
          tofu -chdir=infrastructure/flux init -backend=false -input=false
          tofu -chdir=infrastructure/recovery init -backend=false -input=false
      - name: Validate roots
        run: |
          tofu -chdir=infrastructure/talos validate
          tofu -chdir=infrastructure/cilium validate
          tofu -chdir=infrastructure/flux validate
          tofu -chdir=infrastructure/recovery validate
      - name: Test recovery sizing with an offline mocked provider
        # Fixture only, not a production passphrase. The root encryption block
        # needs its variable before test-file variables are evaluated.
        env:
          TF_VAR_state_passphrase: NON_SECRET_TEST_FIXTURE_STATE_PASSPHRASE
        run: tofu -chdir=infrastructure/recovery test -no-color

  required:
    name: Static checks
    if: always()
    needs:
      - secrets
      - configuration
      - opentofu
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to pass
        env:
          CONFIGURATION_RESULT: ${{ needs.configuration.result }}
          OPENTOFU_RESULT: ${{ needs.opentofu.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          test "$CONFIGURATION_RESULT" = success
          test "$OPENTOFU_RESULT" = success
          test "$SECRETS_RESULT" = success
