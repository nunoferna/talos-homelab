name: Static checks

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  configuration:
    name: Configuration validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install validation tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Lint YAML
        run: yamllint .
      - name: Check Ansible syntax
        working-directory: management/ansible
        run: |
          for playbook in discover prepare-artifacts stage activate stop test-proxy; do
            ansible-playbook --syntax-check "${playbook}.yaml"
          done
      - name: Compile Python
        run: python -m py_compile tests/proxy_dhcp_isolated.py

  opentofu:
    name: OpenTofu validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      - name: Check formatting
        run: tofu -chdir=infrastructure/talos fmt -check -diff
      - name: Initialize without the remote backend
        run: tofu -chdir=infrastructure/talos init -backend=false -input=false
      - name: Validate configuration
        run: tofu -chdir=infrastructure/talos validate
