name: Static checks

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete history
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        # gitleaks/gitleaks-action v2
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  configuration:
    name: Configuration validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Lint YAML
        run: yamllint .
      - name: Check Ansible syntax
        working-directory: management/ansible
        run: |
          for playbook in discover prepare-artifacts stage activate stop test-proxy runner; do
            ansible-playbook --syntax-check "${playbook}.yaml"
          done
      - name: Compile Python
        run: python -m py_compile tests/proxy_dhcp_isolated.py

  opentofu:
    name: OpenTofu validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up OpenTofu
        # opentofu/setup-opentofu v1
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_version: 1.12.6
      - name: Check formatting
        run: tofu fmt -check -diff -recursive infrastructure
      - name: Initialize roots without remote backends
        run: |
          tofu -chdir=infrastructure/talos init -backend=false -input=false
          tofu -chdir=infrastructure/cilium init -backend=false -input=false
      - name: Validate roots
        run: |
          tofu -chdir=infrastructure/talos validate
          tofu -chdir=infrastructure/cilium validate
