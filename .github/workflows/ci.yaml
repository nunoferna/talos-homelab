name: Static checks

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete history
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        # gitleaks/gitleaks-action v3
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  configuration:
    name: Configuration validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        # actions/setup-python v6
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Lint YAML
        run: yamllint .
      - name: Check Ansible syntax
        working-directory: management/ansible
        run: |
          for playbook in discover prepare-artifacts stage activate stop test-proxy runner; do
            ansible-playbook --syntax-check "${playbook}.yaml"
          done
      - name: Compile Python
        run: python -m py_compile tests/proxy_dhcp_isolated.py

  opentofu:
    name: OpenTofu validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up OpenTofu
        # opentofu/setup-opentofu v2
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4
        with:
          tofu_version: 1.12.6
      - name: Check formatting
        run: tofu fmt -check -diff -recursive infrastructure
      - name: Initialize roots without remote backends
        run: |
          tofu -chdir=infrastructure/talos init -backend=false -input=false
          tofu -chdir=infrastructure/cilium init -backend=false -input=false
      - name: Validate roots
        run: |
          tofu -chdir=infrastructure/talos validate
          tofu -chdir=infrastructure/cilium validate
