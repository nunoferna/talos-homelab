---
# No Kubernetes API token or Kubernetes RBAC privileges are needed by the pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-backup
automountServiceAccountToken: false
---
# Talos generates this identity's Secret; no private material is stored in Git.
# This CRD must exist before the directory is added to the live Flux root.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-backup-identity
spec:
  roles:
    - os:etcd:backup
