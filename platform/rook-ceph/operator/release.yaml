apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  # Preparation only: disconnected from clusters/homelab AND suspended.
  suspend: true
  interval: 10m
  timeout: 5m
  releaseName: rook-ceph
  chart:
    spec:
      chart: rook-ceph
      version: 1.21.0
      sourceRef:
        kind: HelmRepository
        name: rook-release
  values:
    image:
      repository: docker.io/rook/ceph
      tag: v1.21.0
    crds:
      enabled: true
    currentNamespaceOnly: true
    reconcileConcurrentClusters: 1
    enableDiscoveryDaemon: false
    disableDeviceHotplug: true
    allowLoopDevices: false
    useOperatorHostNetwork: false
    enforceHostNetwork: false
    revisionHistoryLimit: 2
    # Rook 1.21 separates CSI deployment; neither operator nor drivers yet.
    csi:
      installCsiOperator: false
      createCsiOperatorResources: false
      serviceMonitor:
        enabled: false
    monitoring:
      enabled: false
    rbacAggregate:
      enableOBCs: false
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 2016
      runAsGroup: 2016
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        memory: 512Mi
