apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-prerequisites
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./platform/gateway-api/resources
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: false
  deletionPolicy: Orphan
  force: false
  healthChecks:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: gateway-api-crds
      namespace: flux-system
