---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: private-gitops-reconciler
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: private-gitops-proof
  namespace: flux-system
rules:
  # Kubernetes cannot restrict create with resourceNames. Updates/deletion are
  # restricted to the proof object; no Secrets, Flux CRs or RBAC are writable.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [private-gitops-proof]
    verbs: [get, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: private-gitops-proof
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: private-gitops-proof
subjects:
  - kind: ServiceAccount
    name: private-gitops-reconciler
    namespace: flux-system
