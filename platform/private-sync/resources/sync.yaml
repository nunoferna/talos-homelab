---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-private
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 2m
  path: ./clusters/homelab
  prune: true
  force: false
  wait: true
  serviceAccountName: private-gitops-reconciler
  sourceRef:
    kind: GitRepository
    name: homelab-private
  decryption:
    provider: sops
    secretRef:
      name: sops-age
