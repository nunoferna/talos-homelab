apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: apps-internal
  namespace: apps-gateway
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: '${APPS_GATEWAY_IPV4}'
  listeners:
    - name: https
      hostname: '*.apps.internal'
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: apps-internal-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              apps.internal/gateway-access: 'true'
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
