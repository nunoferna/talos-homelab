apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-gateway
  namespace: flux-system
spec:
  suspend: true
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  path: ./platform/apps-gateway/resources
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: gateway-api-crds
    - name: apps-gateway-inputs
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: apps-gateway-site
        optional: false
  prune: true
  force: false
  wait: true
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      current: >-
        has(status) && has(status.conditions) &&
        ['Accepted', 'Programmed'].all(t,
          status.conditions.exists(c,
            c.type == t && c.status == 'True' &&
            c.observedGeneration == metadata.generation))
