apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-poc
  namespace: external-secrets
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes-poc
          role: eso-openbao-poc
          serviceAccountRef:
            name: eso-openbao-poc
            audiences:
              - openbao-poc
