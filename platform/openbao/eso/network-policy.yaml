apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-openbao
  namespace: external-secrets
spec:
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.policy.serviceaccount: external-secrets
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openbao
            k8s:io.cilium.k8s.policy.serviceaccount: openbao
      toPorts:
        - ports:
            - port: '8200'
              protocol: TCP
