apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-poc
  namespace: external-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: openbao-poc
  target:
    name: openbao-poc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: message
      remoteRef:
        key: poc/eso-demo
        property: message
