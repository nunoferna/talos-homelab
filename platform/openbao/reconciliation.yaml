apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./platform/openbao/resources
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Retain persistence and releases when this reconciliation is removed.
  prune: false
  deletionPolicy: Orphan
  force: false
  # Helm success proves installation, NOT initialized/unsealed readiness.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cnpg
      namespace: openbao
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openbao-db
      namespace: openbao
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: openbao-db
      namespace: openbao
    - apiVersion: v1
      kind: PersistentVolumeClaim
      name: openbao-db-1
      namespace: openbao
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: openbao-inputs
      namespace: flux-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openbao
      namespace: openbao
