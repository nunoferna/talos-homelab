apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-foundation
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/openbao/foundation
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: false
  deletionPolicy: Orphan
  force: false
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-private
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: openbao-foundation
  path: ./platform/openbao/private-sync
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: false
  deletionPolicy: Orphan
  force: false
  wait: false
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: private-gitops-settings
        optional: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-server
  namespace: flux-system
spec:
  # No reference from clusters/homelab, and separate activation approval.
  suspend: true
  interval: 10m
  timeout: 5m
  dependsOn:
    - name: openbao-foundation
    - name: openbao-settings
    - name: openbao-inputs
  path: ./platform/openbao/server
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: openbao-settings
        optional: false
  prune: false
  deletionPolicy: Orphan
  force: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openbao
      namespace: openbao
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-eso-poc
  namespace: flux-system
spec:
  # Unseal and configure the bounded auth/policy before enabling this adapter.
  suspend: true
  interval: 1m
  dependsOn:
    - name: openbao-server
    - name: external-secrets
  path: ./platform/openbao/eso
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: false
  deletionPolicy: Orphan
  force: false
  wait: false
