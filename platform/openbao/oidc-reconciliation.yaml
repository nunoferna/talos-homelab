apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-oidc-access
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  path: ./platform/openbao/oidc
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: openbao
    - name: apps-pki
  prune: false
  deletionPolicy: Orphan
  force: false
  wait: true
