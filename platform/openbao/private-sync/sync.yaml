apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-settings
  namespace: flux-system
spec:
  interval: 1m
  path: ./clusters/homelab/openbao/settings
  sourceRef:
    kind: GitRepository
    name: homelab-openbao
  serviceAccountName: openbao-settings-reconciler
  prune: false
  deletionPolicy: Orphan
  force: false
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-inputs
  namespace: flux-system
spec:
  # Ciphertext and CA must be supplied in a reviewed private inputs PR first.
  suspend: true
  interval: 1m
  path: ./clusters/homelab/openbao/inputs
  sourceRef:
    kind: GitRepository
    name: homelab-openbao
  serviceAccountName: openbao-inputs-reconciler
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: false
  deletionPolicy: Orphan
  force: false
  wait: false
