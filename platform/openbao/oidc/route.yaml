apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  namespace: openbao
spec:
  parentRefs:
    - name: apps-internal
      namespace: apps-gateway
      sectionName: https
  hostnames: [openbao.apps.internal]
  rules:
    - backendRefs:
        - name: openbao
          port: 8200
