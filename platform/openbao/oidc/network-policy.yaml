apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-oidc
  namespace: openbao
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - port: '8200'
              protocol: TCP
  egress:
    # OIDC discovery, JWKS and token exchange through the shared HTTPS gateway.
    - toEntities: [ingress]
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
    # Pod-origin Gateway traffic is also evaluated against its real backend.
    # Keycloak ingress still accepts only the gateway's ingress identity.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: keycloak
            app: keycloak
            app.kubernetes.io/instance: keycloak
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
