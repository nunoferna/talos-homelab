apiVersion: v1
kind: PersistentVolume
metadata:
  name: openbao-local-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: openbao-local
  # Reserve this directory for the one chart-generated claim, not other apps.
  claimRef:
    namespace: openbao
    name: data-openbao-0
  local:
    path: /var/mnt/openbao-poc
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ${OPENBAO_STORAGE_NODE}
