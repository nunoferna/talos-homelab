apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  suspend: true
  interval: 10m
  timeout: 5m
  releaseName: openbao
  chart:
    spec:
      chart: openbao
      version: 0.30.3
      sourceRef:
        kind: HelmRepository
        name: openbao
  install:
    # Normal OpenBao starts sealed. Helm success is NOT unsealed readiness.
    disableWait: true
    remediation:
      retries: 0
  upgrade:
    disableWait: true
    remediation:
      retries: 0
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: openbao
            # Upstream's exec readiness skips verification and its default
            # API address is a pod IP. Pin service DNS and verified CLI health.
            patch: |-
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: openbao
              spec:
                template:
                  spec:
                    containers:
                      - name: openbao
                        env:
                          - name: BAO_API_ADDR
                            value: https://openbao.openbao.svc:8200
                          - name: BAO_CLUSTER_ADDR
                            value: https://openbao-0.openbao-internal.openbao.svc:8201
                        readinessProbe:
                          exec:
                            command:
                              - /bin/sh
                              - -ec
                              - bao status
  values:
    global:
      tlsDisable: false
    injector:
      enabled: false
    csi:
      enabled: false
    snapshotAgent:
      enabled: false
    serverTelemetry:
      serviceMonitor:
        enabled: false
      grafanaDashboard:
        enabled: false
    ui:
      enabled: false
    server:
      enabled: true
      image:
        tag: '2.7.1'
      dev:
        enabled: false
      standalone:
        enabled: true
        config: |
          ui = false
          disable_mlock = true
          api_addr = "https://openbao.openbao.svc:8200"
          cluster_addr = "https://openbao-0.openbao-internal.openbao.svc:8201"
          listener "tcp" {
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file = "/openbao/tls/tls.crt"
            tls_key_file = "/openbao/tls/tls.key"
            tls_min_version = "tls12"
            tls_auto_reload = true
          }
          storage "raft" {
            path = "/openbao/data"
            node_id = "openbao-0"
          }
      ha:
        enabled: false
        disruptionBudget:
          enabled: false
      updateStrategyType: OnDelete
      terminationGracePeriodSeconds: 60
      logLevel: info
      logFormat: json
      ingress:
        enabled: false
      authDelegator:
        enabled: false
      serviceAccount:
        createSecret: false
        serviceDiscovery:
          enabled: false
      service:
        publishNotReadyAddresses: true
      dataStorage:
        enabled: true
        size: 2Gi
        storageClass: openbao-local
        accessMode: ReadWriteOnce
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
      auditStorage:
        enabled: false
      readinessProbe:
        enabled: true
      livenessProbe:
        enabled: true
        # Do not restart-loop a sealed or uninitialized server.
        path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
      extraEnvironmentVars:
        BAO_CACERT: /openbao/tls/ca.crt
        VAULT_CACERT: /openbao/tls/ca.crt
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: tls
          secret:
            secretName: openbao-tls
            defaultMode: 288  # 0440, readable by the pod's filesystem group.
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: tls
          mountPath: /openbao/tls
          readOnly: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      statefulSet:
        securityContext:
          pod:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          container:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
