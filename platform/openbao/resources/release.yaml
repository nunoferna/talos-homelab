apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  suspend: false
  interval: 10m
  timeout: 5m
  releaseName: openbao
  dependsOn:
    - name: openbao-db
      namespace: openbao
  chart:
    spec:
      chart: openbao
      version: 0.30.3
      sourceRef:
        kind: HelmRepository
        name: openbao
  install:
    # Normal OpenBao starts sealed. Helm success is NOT unsealed readiness.
    disableWait: true
    remediation:
      retries: 0
  upgrade:
    disableWait: true
    remediation:
      retries: 0
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: openbao
            # The one chart correction retained: verified CLI readiness.
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/readinessProbe/exec/command
                value: [/bin/sh, -ec, bao status]
  values:
    global:
      tlsDisable: false
    injector:
      enabled: false
    csi:
      enabled: false
    server:
      standalone:
        enabled: true
        config: |
          ui = false
          disable_mlock = true
          api_addr = "https://openbao.openbao.svc:8200"
          cluster_addr = "https://openbao-0.openbao-internal.openbao.svc:8201"
          listener "tcp" {
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file = "/openbao/tls/tls.crt"
            tls_key_file = "/openbao/tls/tls.key"
            tls_min_version = "tls12"
            tls_auto_reload = true
          }
          storage "postgresql" {
            max_parallel = 4
            max_connect_retries = 50
          }
      ha:
        enabled: false
        apiAddr: https://openbao.openbao.svc:8200
        clusterAddr: https://openbao-0.openbao-internal.openbao.svc:8201
      authDelegator:
        enabled: false
      serviceAccount:
        serviceDiscovery:
          enabled: false
      dataStorage:
        enabled: false
      livenessProbe:
        enabled: true
        # Do not restart-loop a sealed or uninitialized server.
        path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
      extraEnvironmentVars:
        BAO_CACERT: /openbao/tls/ca.crt
        PGHOST: openbao-db-rw.openbao.svc
        PGPORT: '5432'
        PGDATABASE: openbao
        PGSSLMODE: verify-full
        PGSSLROOTCERT: /openbao/postgresql/ca.crt
      extraSecretEnvironmentVars:
        - envName: PGUSER
          secretName: openbao-db-app
          secretKey: username
        - envName: PGPASSWORD
          secretName: openbao-db-app
          secretKey: password
      volumes:
        - name: postgresql-ca
          secret:
            secretName: openbao-db-ca
            defaultMode: 288
            # Mount only the public CA, never the operator's signing key.
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: tls
          secret:
            secretName: openbao-tls
            defaultMode: 288  # 0440, readable by the pod's filesystem group.
      volumeMounts:
        - name: postgresql-ca
          mountPath: /openbao/postgresql
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: tls
          mountPath: /openbao/tls
          readOnly: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      statefulSet:
        securityContext:
          pod:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          container:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
