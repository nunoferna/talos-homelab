apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-postgresql
  namespace: openbao
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: openbao-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: openbao
            component: server
      toPorts:
        - ports:
            - port: '5432'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: '8000'
              protocol: TCP
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - port: '8000'
              protocol: TCP
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
            - port: '6443'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-postgresql-operator
  namespace: openbao
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  ingress:
    - fromEntities: [kube-apiserver, host, remote-node]
      toPorts:
        - ports:
            - port: '9443'
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: keycloak
            cnpg.io/cluster: keycloak-db
      toPorts:
        - ports:
            - port: '8000'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: openbao-db
      toPorts:
        - ports:
            - port: '8000'
              protocol: TCP
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
            - port: '6443'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
