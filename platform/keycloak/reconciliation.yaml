apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-prerequisites
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  timeout: 3m
  path: ./platform/keycloak/preparation
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: false
  deletionPolicy: Orphan
  force: false
