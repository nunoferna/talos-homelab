apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-config
  namespace: keycloak
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-config
  namespace: keycloak
spec:
  schedule: '*/5 * * * *'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keycloak-config
        spec:
          serviceAccountName: keycloak-config
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: truststore
              image: &configImage >-
                quay.io/adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
              command:
                - keytool
                - -importcert
                - -noprompt
                - -alias
                - apps-internal
                - -file
                - /ca/ca.crt
                - -keystore
                - /trust/ca.p12
                - -storetype
                - PKCS12
                - -storepass
                - changeit  # Public-CA-only truststore; contains no private key.
              securityContext: &containerSecurity
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              volumeMounts:
                - name: ca
                  mountPath: /ca
                  readOnly: true
                - name: truststore
                  mountPath: /trust
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: config
              image: *configImage
              securityContext: *containerSecurity
              env:
                - name: KEYCLOAK_URL
                  value: https://keycloak.apps.internal
                - name: KEYCLOAK_LOGINREALM
                  value: homelab
                - name: KEYCLOAK_GRANTTYPE
                  value: client_credentials
                - name: KEYCLOAK_CLIENTID
                  value: homelab-config
                - name: KEYCLOAK_CLIENTSECRET
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-config
                      # The pinned Java client does not form-encode Basic credentials.
                      key: client-secret-basic
                - name: KEYCLOAK_SKIPSERVERINFO
                  value: 'true'  # Own-realm administration needs no master access.
                - name: KEYCLOAK_SSLVERIFY
                  value: 'true'
                - name: KEYCLOAK_TLS_TRUSTSTOREPATH
                  value: /trust/ca.p12
                - name: KEYCLOAK_TLS_TRUSTSTORETYPE
                  value: PKCS12
                - name: KEYCLOAK_TLS_TRUSTSTOREPASSWORD
                  value: changeit
                - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
                  value: 'true'
                - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
                  value: 60s
                - name: IMPORT_FILES_LOCATIONS
                  value: file:/config/realm.json
                - name: IMPORT_CACHE_ENABLED
                  value: 'false'  # Reconcile drift even when Git is unchanged.
                - name: IMPORT_REMOTESTATE_ENABLED
                  value: 'true'
                - name: IMPORT_VARSUBSTITUTION_ENABLED
                  value: 'false'
                - name: IMPORT_MANAGED_CLIENT
                  value: no-delete
                - name: IMPORT_MANAGED_GROUP
                  value: no-delete
                - name: IMPORT_MANAGED_AUTHENTICATIONFLOW
                  value: no-delete
                - name: IMPORT_MANAGED_REQUIREDACTION
                  value: no-delete
                - name: LOGGING_LEVEL_ROOT
                  value: WARN
                - name: LOGGING_LEVEL_HTTP
                  value: 'OFF'
                - name: LOGGING_LEVEL_REALMCONFIG
                  value: 'OFF'
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 768Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: truststore
                  mountPath: /trust
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: keycloak-realm-config
            - name: ca
              configMap:
                name: keycloak-config-ca
            - name: truststore
              emptyDir:
                medium: Memory
                sizeLimit: 8Mi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
