apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - name: apps-internal
      namespace: apps-gateway
      sectionName: https
  hostnames: ['${KEYCLOAK_HOSTNAME}']
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080
