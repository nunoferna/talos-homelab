apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: apps-dns
  namespace: apps-dns
spec:
  interval: 10m
  timeout: 5m
  releaseName: apps-dns
  chart:
    spec:
      chart: coredns
      version: 1.49.0
      sourceRef:
        kind: HelmRepository
        name: coredns
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  postRenderers:
    - kustomize:
        patches:
          # The upstream chart does not expose this Service setting.
          - target:
              version: v1
              kind: Service
              name: apps-dns
            patch: |-
              - op: add
                path: /spec/allocateLoadBalancerNodePorts
                value: false
  values:
    fullnameOverride: apps-dns
    isClusterService: false
    replicaCount: 2
    image:
      tag: 1.14.7
    rbac:
      create: false
    serviceAccount:
      create: true
    automountServiceAccountToken: false
    serviceType: LoadBalancer
    service:
      name: apps-dns
      loadBalancerClass: io.cilium/l2-announcer
      externalTrafficPolicy: Cluster
      ipFamilyPolicy: SingleStack
      annotations:
        lbipam.cilium.io/ips: '${APPS_DNS_IPV4}'
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    podDisruptionBudget:
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: apps-dns
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop: [ALL]
        add: []
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    servers:
      - zones:
          - zone: apps.internal
            use_tcp: true
        port: 1053
        servicePort: 53
        plugins:
          - name: errors
          - name: health
            configBlock: lameduck 5s
          - name: ready
          - name: file
            parameters: /etc/coredns/apps.internal.zone apps.internal
          - name: cache
            parameters: 30
          - name: reload
    zoneFiles:
      - filename: apps.internal.zone
        domain: apps.internal
        contents: |
          apps.internal. 30 IN SOA ns.apps.internal. hostmaster.apps.internal. (
              ${APPS_DNS_SERIAL} 3600 600 86400 30
          )
          apps.internal. 30 IN NS ns.apps.internal.
          ns.apps.internal. 30 IN A ${APPS_DNS_IPV4}
          keycloak.apps.internal. 30 IN A ${APPS_GATEWAY_IPV4}
