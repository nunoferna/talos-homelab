apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: apps-dns
  namespace: apps-dns
spec:
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: apps-dns
      app.kubernetes.io/name: coredns
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
            k8s:io.cilium.k8s.policy.serviceaccount: coredns
      toPorts:
        - ports:
            - port: '1053'
              protocol: UDP
            - port: '1053'
              protocol: TCP
    # The Service source-range guard filters original external clients first.
    # VXLAN retains world identity after cross-node Service SNAT.
    - fromEntities: [world]
      toPorts:
        - ports:
            - port: '1053'
              protocol: UDP
            - port: '1053'
              protocol: TCP
    # Node DNS diagnostics and kubelet probes; never world access to probes.
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - port: '1053'
              protocol: UDP
            - port: '1053'
              protocol: TCP
            - port: '8080'
              protocol: TCP
            - port: '8181'
              protocol: TCP
  # No pod-initiated API, upstream DNS or other outbound connections.
  # Stateful replies to allowed inbound connections remain permitted.
  egressDeny:
    - toEntities: [all]
