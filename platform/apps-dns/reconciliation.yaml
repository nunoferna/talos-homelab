apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-dns-prerequisites
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 2m
  path: ./platform/apps-dns/preparation
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: false
  deletionPolicy: Orphan
  force: false
  # Only namespace/RBAC and suspended reconcilers, not a DNS deployment.
  wait: false
