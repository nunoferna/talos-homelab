apiVersion: v1
kind: ServiceAccount
metadata:
  name: apps-dns-inputs
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apps-dns-inputs
  namespace: flux-system
rules:
  # Kubernetes cannot restrict create by name; subsequent writes are bounded.
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [create]
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [apps-dns-site]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apps-dns-inputs
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: apps-dns-inputs
subjects:
  - kind: ServiceAccount
    name: apps-dns-inputs
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-dns-inputs
  namespace: flux-system
spec:
  suspend: true
  interval: 1m
  retryInterval: 30s
  timeout: 2m
  path: ./clusters/homelab/dns/inputs
  sourceRef:
    kind: GitRepository
    name: homelab-private
  serviceAccountName: apps-dns-inputs
  prune: false
  deletionPolicy: Orphan
  force: false
  wait: true
