apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-dns
  namespace: flux-system
spec:
  suspend: false
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  path: ./platform/apps-dns/resources
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: apps-dns-inputs
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: apps-dns-site
        optional: false
  prune: true
  force: false
  wait: true
