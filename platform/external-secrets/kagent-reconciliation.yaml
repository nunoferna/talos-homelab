apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: eso-kagent
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./platform/external-secrets/kagent
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets
    - name: openbao
  prune: true
  force: false
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: SecretStore
      name: openbao
      namespace: kagent
