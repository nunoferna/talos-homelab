apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 10m
  timeout: 5m
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 2.11.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
  values:
    replicaCount: 1
    revisionHistoryLimit: 2
    installCRDs: true
    scopedRBAC: true
    scopedNamespace: external-secrets
    processClusterStore: false
    processClusterExternalSecret: false
    processClusterPushSecret: false
    processClusterGenerator: false
    processPushSecret: false
    openshiftFinalizers: false
    systemAuthDelegator: false
    crds:
      createClusterSecretStore: false
      createClusterExternalSecret: false
      createClusterPushSecret: false
      createClusterGenerator: false
      createPushSecret: false
      annotations:
        helm.sh/resource-policy: keep
      conversion:
        enabled: false
    rbac:
      serviceAccountTokenCreate: false
      servicebindings:
        create: false
      aggregateToView: false
      aggregateToEdit: false
      aggregateToAdmin: false
    genericTargets:
      enabled: false
    bitwarden-sdk-server:
      enabled: false
    # Empty controller-only PoC, not the configuration for real secret stores.
    # Avoid the upstream certificate controller's cluster-wide Secret reads.
    webhook:
      create: false
    certController:
      create: false
    livenessProbe:
      enabled: true
    readinessProbe:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    metrics:
      service:
        enabled: false
    serviceMonitor:
      enabled: false
