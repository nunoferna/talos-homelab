apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-kagent
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-kagent-token
rules:
  - apiGroups: ['']
    resources: [serviceaccounts/token]
    resourceNames: [openbao-kagent]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-kagent-token
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-kagent-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
