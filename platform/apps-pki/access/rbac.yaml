apiVersion: v1
kind: ServiceAccount
metadata:
  name: apps-internal-issuer
  namespace: apps-gateway
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apps-internal-issuer
  namespace: apps-gateway
rules:
  - apiGroups: ['']
    resources: [serviceaccounts/token]
    resourceNames: [apps-internal-issuer]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apps-internal-issuer
  namespace: apps-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: apps-internal-issuer
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
# The OpenBao pod uses its rotating local token, never a stored reviewer JWT.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbao-pki-tokenreview
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-pki-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openbao-pki-tokenreview
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: openbao
