apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-pki-access
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  timeout: 3m
  path: ./platform/apps-pki/access
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cert-manager
    - name: openbao
    - name: apps-gateway-prerequisites
  prune: false
  deletionPolicy: Orphan
  force: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-pki
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  timeout: 5m
  path: ./platform/apps-pki/resources
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: apps-pki-access
    - name: apps-gateway-inputs
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: apps-gateway-site
        optional: false
  prune: false
  deletionPolicy: Orphan
  force: false
  wait: true
