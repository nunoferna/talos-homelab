# The chart post-renderer removes cainjector's cluster-wide Secret access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-cainjector-source
  namespace: cert-manager
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [events]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-cainjector-source
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-cainjector-source
subjects:
  - kind: ServiceAccount
    name: cert-manager-cainjector
    namespace: cert-manager
