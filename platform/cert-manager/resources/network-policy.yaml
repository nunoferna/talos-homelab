apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  endpointSelector: {}
  ingress: []
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
            - port: '6443'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-probes
  namespace: cert-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: controller
  ingress:
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - port: '9403'
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: webhook
  ingress:
    # Talos API-server traffic can arrive with host/remote-node identities.
    # Limit node access to the admission listener, not the whole namespace.
    - fromEntities: [kube-apiserver, host, remote-node]
      toPorts:
        - ports:
            - port: '10250'
              protocol: TCP
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - port: '6080'
              protocol: TCP
