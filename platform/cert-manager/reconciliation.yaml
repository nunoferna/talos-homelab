apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  timeout: 5m
  path: ./platform/cert-manager/resources
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: false
  deletionPolicy: Orphan
  force: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
