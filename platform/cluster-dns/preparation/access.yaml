apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-dns-config
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-dns-config
  namespace: kube-system
rules:
  # Talos bootstraps this object; Flux adopts only its existing configuration.
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [coredns]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [coredns]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-dns-config
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-dns-config
subjects:
  - kind: ServiceAccount
    name: cluster-dns-config
    namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-dns-config-input
  namespace: flux-system
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [apps-dns-site]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-dns-config-input
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-dns-config-input
subjects:
  - kind: ServiceAccount
    name: cluster-dns-config
    namespace: flux-system
