apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-dns
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 2m
  path: ./platform/cluster-dns/resources
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: cluster-dns-config
  dependsOn:
    - name: apps-dns
    - name: apps-dns-inputs
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: apps-dns-site
        optional: false
  prune: false
  deletionPolicy: Orphan
  force: false
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: coredns
      namespace: kube-system
  # The default Deployment reader also lists ReplicaSets and Pods. Read only
  # this Deployment's controller-reported status with the existing scoped role.
  healthCheckExprs:
    - apiVersion: apps/v1
      kind: Deployment
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(spec.replicas) && spec.replicas > 0 &&
        ['replicas', 'updatedReplicas', 'readyReplicas', 'availableReplicas'].all(f,
          f in status && status[f] == spec.replicas) &&
        has(status.conditions) &&
        status.conditions.exists(c, c.type == 'Available' && c.status == 'True')
