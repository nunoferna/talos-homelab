apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-dns-prerequisites
  namespace: flux-system
spec:
  interval: 10m
  timeout: 2m
  path: ./platform/cluster-dns/preparation
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: apps-dns
  prune: false
  deletionPolicy: Orphan
  force: false
  wait: false
