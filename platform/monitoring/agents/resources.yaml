apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-observability
  namespace: kagent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-promql
  namespace: kagent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kagent-observability-values
  namespace: kagent
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    observability-agent:
      enabled: true
      runtime: go
      modelConfigRef: default-model-config
    promql-agent:
      enabled: true
      runtime: go
      modelConfigRef: default-model-config
