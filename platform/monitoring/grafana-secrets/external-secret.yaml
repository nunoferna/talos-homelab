apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-bootstrap
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: grafana-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: homelab/monitoring/grafana
