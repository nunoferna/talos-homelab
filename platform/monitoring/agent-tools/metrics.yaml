apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: grafana-mcp
  namespace: monitoring
  labels:
    release: monitoring-stack
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
