apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-controller-mcp-discovery
  namespace: kagent
spec:
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.policy.serviceaccount: kagent-controller
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:io.cilium.k8s.policy.serviceaccount: monitoring-grafana-mcp
      toPorts:
        - ports:
            - port: '8000'
              protocol: TCP
