apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-grafana-mcp
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: grafana-mcp
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: monitoring-grafana-mcp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          # yamllint disable-line rule:line-length
          image: docker.io/grafana/mcp-grafana:2.1.1@sha256:71a3f4e6f412d253611314233df709ec2571fb50e39742d23fa2940f670646dc
          args:
            - --transport=streamable-http
            - --address=:8000
            - --allowed-hosts=grafana-mcp.monitoring.svc.cluster.local:8000
            - --healthz-address=:8080
            - --metrics-address=:8081
            - --disable-write
            - --enabled-tools=search,datasource,dashboard,prometheus
          env:
            - name: GRAFANA_URL
              value: http://grafana.monitoring.svc.cluster.local:80
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE
              value: /credentials/token
          ports:
            - name: mcp
              containerPort: 8000
            - name: health
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: token
              mountPath: /credentials
              readOnly: true
      volumes:
        - name: token
          secret:
            secretName: grafana-mcp-token
            defaultMode: 288
            items:
              - key: token
                path: token
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-mcp
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: grafana-mcp
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: grafana-read
  namespace: kagent
spec:
  url: http://grafana-mcp.monitoring.svc.cluster.local:8000/mcp
  description: Official Grafana MCP; Viewer token, query-only tools, namespace network boundary.
  protocol: STREAMABLE_HTTP
