apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 10m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: grafana
  install:
    crds: CreateReplace
    remediation:
      retries: 0
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 0
  values:
    fullnameOverride: grafana
    replicas: 1
    testFramework:
      enabled: false
    serviceAccount:
      name: monitoring-grafana
    rbac:
      namespaced: true
    admin:
      existingSecret: grafana-bootstrap
    persistence:
      enabled: false
    initChownData:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
        secretKeyRef:
          name: grafana-bootstrap
          key: client-id
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-bootstrap
          key: client-secret
    extraConfigmapMounts:
      - name: keycloak-ca
        mountPath: /etc/grafana/keycloak-ca
        configMap: grafana-keycloak-ca
        readOnly: true
    grafana.ini:
      server:
        root_url: https://grafana.apps.internal
        domain: grafana.apps.internal
      security:
        cookie_secure: true
        cookie_samesite: lax
        disable_gravatar: true
      analytics:
        reporting_enabled: false
        check_for_updates: false
        check_for_plugin_updates: false
      auth:
        disable_login_form: true
        oauth_auto_login: true
      auth.anonymous:
        enabled: false
      auth.generic_oauth:
        enabled: true
        name: Homelab passkey
        allow_sign_up: true
        client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
        client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
        scopes: openid profile email
        auth_url: https://keycloak.apps.internal/realms/homelab/protocol/openid-connect/auth
        token_url: https://keycloak.apps.internal/realms/homelab/protocol/openid-connect/token
        api_url: https://keycloak.apps.internal/realms/homelab/protocol/openid-connect/userinfo
        use_pkce: true
        use_refresh_token: true
        tls_client_ca: /etc/grafana/keycloak-ca/ca.crt
        tls_skip_verify_insecure: false
        groups_attribute_path: groups
        allowed_groups: /bao-operators
        role_attribute_path: contains(groups[*], '/bao-operators') && 'Viewer' || 'None'
        role_attribute_strict: true
        allow_assign_grafana_admin: false
      users:
        viewers_can_edit: false
      unified_alerting:
        enabled: false
    sidecar:
      dashboards:
        enabled: true
        resource: configmap
        searchNamespace: monitoring
        label: grafana_dashboard
        labelValue: '1'
        provider:
          allowUiUpdates: false
        skipReload: true
      datasources:
        enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    datasources:
      datasources.yaml:
        apiVersion: 1
        prune: true
        datasources:
          - name: Prometheus
            uid: prometheus
            type: prometheus
            access: proxy
            url: http://monitoring-stack-prometheus.monitoring.svc.cluster.local:9090
            isDefault: true
            editable: false
            jsonData:
              timeInterval: 30s
              httpMethod: POST
              prometheusType: Prometheus
          - name: Alertmanager
            uid: alertmanager
            type: alertmanager
            access: proxy
            url: http://monitoring-stack-alertmanager.monitoring.svc.cluster.local:9093
            editable: false
            jsonData:
              implementation: prometheus
              handleGrafanaManagedAlerts: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Role
              name: grafana
            patch: |-
              - op: replace
                path: /rules/0/resources
                value: [configmaps]
          - target:
              kind: Deployment
              name: grafana
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: grafana
              spec:
                template:
                  spec:
                    volumes:
                    - name: storage
                      emptyDir:
                        sizeLimit: 512Mi
                    - name: search
                      emptyDir:
                        sizeLimit: 128Mi
                    - name: tmp
                      emptyDir:
                        sizeLimit: 128Mi
                    - name: sc-dashboard-volume
                      emptyDir:
                        sizeLimit: 64Mi
