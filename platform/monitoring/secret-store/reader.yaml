apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-monitoring
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-monitoring-token
rules:
  - apiGroups:
      - ''
    resources:
      - serviceaccounts/token
    resourceNames:
      - openbao-monitoring
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-monitoring-token
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-monitoring-token
subjects:
  - kind: ServiceAccount
    name: external-secrets-monitoring
    namespace: external-secrets
