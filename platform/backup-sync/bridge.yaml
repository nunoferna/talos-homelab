---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup-sync
  namespace: flux-system
spec:
  # NOT referenced by the live public root. Activation needs its own review.
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/backup-sync/resources
  prune: false
  force: false
  wait: false
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: private-gitops-settings
        optional: false
