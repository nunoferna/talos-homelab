apiVersion: v1
kind: ServiceAccount
metadata:
  name: kagent-postgresql
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: kagent-postgresql
spec:
  selector:
    app.kubernetes.io/name: kagent-postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kagent-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kagent-postgresql
    spec:
      serviceAccountName: kagent-postgresql
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: >-
            docker.io/library/postgres:18.6-alpine3.23@sha256:dec395d8c09c45609d6deb5c2388a07882d64fa59b1d98c1895792e085f57888
          env:
            - name: POSTGRES_DB
              value: kagent
            - name: POSTGRES_USER
              value: kagent
            - name: POSTGRES_PASSWORD_FILE
              value: /credentials/password
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command: [pg_isready, '-U', kagent, '-d', kagent]
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec:
              command: [pg_isready, '-U', kagent, '-d', kagent]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: socket
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: credentials
              mountPath: /credentials
              readOnly: true
      volumes:
        # Disposable chat/session history; no PVC or Talos disk changes.
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: socket
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: credentials
          secret:
            secretName: kagent-bootstrap
            defaultMode: 292
            items:
              - key: database-password
                path: password
