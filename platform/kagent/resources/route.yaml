apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
spec:
  parentRefs:
    - name: apps-internal
      namespace: apps-gateway
      sectionName: https
  hostnames: [kagent.apps.internal]
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [X-Agent-Name, X-User-Id]
      backendRefs:
        - name: kagent-oauth2-proxy
          port: 4180
