apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-default-deny
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-proxy
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: kagent-oauth2-proxy
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: '4180'
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: '4180'
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent
            io.cilium.k8s.policy.serviceaccount: kagent-ui
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
    - toEntities:
        - ingress
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: keycloak
            app: keycloak
            app.kubernetes.io/instance: keycloak
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-ui
spec:
