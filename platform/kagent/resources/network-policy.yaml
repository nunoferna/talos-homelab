    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent
            io.cilium.k8s.policy.serviceaccount: kagent-controller
      toPorts:
        - ports:
            - port: '8083'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
