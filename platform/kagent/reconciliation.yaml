apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kagent-prerequisites
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./platform/kagent/preparation
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets
  prune: false
  force: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kagent-crds
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./platform/kagent/crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kagent-prerequisites
  prune: false
  force: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kagent-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./platform/kagent/secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: eso-kagent
    - name: keycloak-realm-config
  prune: true
  force: false
  wait: true
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: >-
        has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kagent
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./platform/kagent/resources
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kagent-crds
    - name: kagent-secrets
    - name: kagent-inputs
    - name: apps-gateway
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: kagent-site
        optional: false
  prune: true
  force: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kagent-agent
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./platform/kagent/agent
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kagent
  prune: true
  force: false
  wait: true
  healthCheckExprs:
    - apiVersion: kagent.dev/v1alpha2
      kind: Agent
      current: >-
        has(status.observedGeneration) && status.observedGeneration == metadata.generation &&
        has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
