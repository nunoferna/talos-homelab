---
- name: Prepare native tools on the operator recovery workstation
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  vars:
    # Public tools only; private key custody must use separate encrypted storage.
    recovery_tools_directory: '{{ ansible_env.HOME }}/.local/share/homelab-recovery-tools'
    recovery_age_version: 1.3.1
    recovery_age_sha256: 01120ea2cbf0463d4c6bd767f99f3271bbed1cdc8a9aa718a76ba1fe4f01998b
    recovery_sops_version: 3.13.3
    recovery_sops_sha256: b97c0d434aab577dc40310e8d22ff9e45eef4c80638ab978daae9b4681c59286
  tasks:
    - name: Require the explicitly supported operator platform and a dedicated directory
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == 'Darwin'
          - ansible_facts['architecture'] == 'arm64'
          - recovery_tools_directory is match('^/.+/homelab-recovery-tools$')
          - recovery_age_version == '1.3.1'
          - recovery_sops_version == '3.13.3'
        fail_msg: This reviewed manifest supports macOS arm64 only, in a dedicated user directory.

    - name: Create narrowly scoped versioned public-tool directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0700'
      loop:
        - '{{ recovery_tools_directory }}'
        - '{{ recovery_tools_directory }}/downloads'
        - '{{ recovery_tools_directory }}/age-v{{ recovery_age_version }}'
        - '{{ recovery_tools_directory }}/sops-v{{ recovery_sops_version }}'

    - name: Download the upstream checksum-pinned age archive
      ansible.builtin.get_url:
        url: >-
          https://github.com/FiloSottile/age/releases/download/v{{ recovery_age_version
          }}/age-v{{ recovery_age_version }}-darwin-arm64.tar.gz
        dest: '{{ recovery_tools_directory }}/downloads/age-v{{ recovery_age_version }}-darwin-arm64.tar.gz'
        checksum: 'sha256:{{ recovery_age_sha256 }}'
        mode: '0600'

    - name: Extract verified public tools using native macOS tar
      # Avoid requiring an unrelated GNU tar installation on the recovery host.
      ansible.builtin.command:
        argv:
          - /usr/bin/tar
          - -xzf
          - '{{ recovery_tools_directory }}/downloads/age-v{{ recovery_age_version }}-darwin-arm64.tar.gz'
          - -C
          - '{{ recovery_tools_directory }}/age-v{{ recovery_age_version }}'
        creates: '{{ recovery_tools_directory }}/age-v{{ recovery_age_version }}/age/age'

    - name: Download the upstream checksum-pinned SOPS binary
      ansible.builtin.get_url:
        url: >-
          https://github.com/getsops/sops/releases/download/v{{ recovery_sops_version
          }}/sops-v{{ recovery_sops_version }}.darwin.arm64
        dest: '{{ recovery_tools_directory }}/sops-v{{ recovery_sops_version }}/sops'
        checksum: 'sha256:{{ recovery_sops_sha256 }}'
        mode: '0700'

    - name: Confirm installed age version without creating an identity
      ansible.builtin.command:
        argv:
          - '{{ recovery_tools_directory }}/age-v{{ recovery_age_version }}/age/age'
          - --version
      changed_when: false
      register: recovery_age_version_result
      when: not ansible_check_mode

    - name: Confirm installed SOPS version without loading a secret
      ansible.builtin.command:
        argv:
          - '{{ recovery_tools_directory }}/sops-v{{ recovery_sops_version }}/sops'
          - --version
      changed_when: false
      register: recovery_sops_version_result
      when: not ansible_check_mode

    - name: Verify pinned versions
      ansible.builtin.assert:
        that:
          - ('v' ~ recovery_age_version) in recovery_age_version_result.stdout
          - recovery_sops_version in recovery_sops_version_result.stdout
      when: not ansible_check_mode
