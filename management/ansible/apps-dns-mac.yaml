---
- name: Preview or explicitly manage only the Mac apps.internal resolver
  hosts: localhost
  connection: local
  gather_facts: true
  gather_subset: [min]
  become: false
  vars:
    apps_dns_mac_operation: preview
    apps_dns_site_file: "{{ lookup('ansible.builtin.env', 'APPS_DNS_SITE_FILE') }}"
    apps_dns_mac_path: /etc/resolver/apps.internal
    apps_dns_mac_marker: '# Managed by homelab Ansible: apps.internal only'
  tasks:
    - name: Require a bounded Mac operation and explicit private input
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == 'Darwin'
          - apps_dns_mac_operation in ['preview', 'enable', 'disable', 'remove-grafana-host-override']
          - apps_dns_site_file.startswith('/')
          - apps_dns_mac_path == '/etc/resolver/apps.internal'

    - name: Load private DNS settings on the controller
      ansible.builtin.include_vars:
        file: "{{ apps_dns_site_file }}"
        name: apps_dns_site

    - name: Restrict the resolver to the intended suffix and IPv4 server
      ansible.builtin.assert:
        that:
          - apps_dns_site.domain == 'apps.internal'
          - apps_dns_site.lan_ip_reservation_confirmed | bool
          - apps_dns_site.listen_ipv4 is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
          - (apps_dns_site.listen_ipv4.split('.') | map('int') | max) <= 255

    - name: Inspect the resolver directory and file without following symlinks
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: [/etc/resolver, "{{ apps_dns_mac_path }}"]
      register: apps_dns_mac_stats

    - name: Reject symlinks or unexpected resolver paths
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
          - >-
            not item.stat.exists or
            (item.item == '/etc/resolver' and (item.stat.isdir | default(false))) or
            (item.item == apps_dns_mac_path and (item.stat.isreg | default(false)) and item.stat.size < 4096)
      loop: "{{ apps_dns_mac_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read an existing resolver file to verify ownership
      ansible.builtin.slurp:
        src: "{{ apps_dns_mac_path }}"
      when: apps_dns_mac_stats.results[1].stat.exists
      register: apps_dns_mac_existing

    - name: Refuse overwriting or deleting an unmanaged resolver file
      ansible.builtin.assert:
        that:
          - >-
            not apps_dns_mac_stats.results[1].stat.exists or
            (apps_dns_mac_existing.content | b64decode).startswith(apps_dns_mac_marker ~ '\n')

    - name: Report the read-only boundary
      ansible.builtin.debug:
        msg: >-
          Operation {{ apps_dns_mac_operation }} manages either the dedicated
          {{ apps_dns_mac_path }} resolver or the exact legacy Grafana alias
          in /etc/hosts. Each operation verifies direct application DNS first.

    - name: Enable only after explicit approval and successful direct DNS queries
      when: apps_dns_mac_operation == 'enable'
      block:
        - name: Reject check mode for a real resolver activation
          ansible.builtin.assert:
            that: [not ansible_check_mode]

        - name: Verify application DNS returns the reviewed address over UDP and TCP
          ansible.builtin.command:
            argv: >-
              {{ ['/usr/bin/dig', '@' ~ apps_dns_site.listen_ipv4,
              'keycloak.apps.internal.', 'A', '+short', '+time=2', '+tries=1'] + item }}
          changed_when: false
          register: apps_dns_mac_direct_query
          failed_when: >-
            apps_dns_mac_direct_query.rc != 0 or
            apps_dns_mac_direct_query.stdout != apps_dns_site.records.keycloak
          loop: [[], ['+tcp']]

        - name: Create the standard resolver directory if absent
          ansible.builtin.file:
            path: /etc/resolver
            state: directory
            owner: root
            group: wheel
            mode: '0755'
          become: true
          when: not apps_dns_mac_stats.results[0].stat.exists

        - name: Write only the managed domain-specific resolver
          ansible.builtin.copy:
            dest: "{{ apps_dns_mac_path }}"
            owner: root
            group: wheel
            mode: '0644'
            content: |
              {{ apps_dns_mac_marker }}
              domain apps.internal
              nameserver {{ apps_dns_site.listen_ipv4 }}
              timeout 2
          become: true

        - name: Verify the macOS system resolver sees the application address
          ansible.builtin.command:
            argv: [/usr/bin/dscacheutil, '-q', host, '-a', name, keycloak.apps.internal]
          changed_when: false
          register: apps_dns_mac_system_query
          until: >-
            (apps_dns_mac_system_query.stdout_lines |
            select('equalto', 'ip_address: ' ~ apps_dns_site.records.keycloak) | list | length) > 0
          retries: 10
          delay: 3

    - name: Remove only the ownership-verified resolver during rollback
      ansible.builtin.file:
        path: "{{ apps_dns_mac_path }}"
        state: absent
      become: true
      when: apps_dns_mac_operation == 'disable'


    - name: Remove only the legacy Grafana hosts override
      when: apps_dns_mac_operation == 'remove-grafana-host-override'
      block:
        - name: Inspect the hosts file without following symlinks
          ansible.builtin.stat:
            path: /etc/hosts
            follow: false
          register: apps_dns_hosts_stat

        - name: Require the protected standard hosts file
          ansible.builtin.assert:
            that:
              - not ansible_check_mode
              - apps_dns_hosts_stat.stat.isreg
              - not apps_dns_hosts_stat.stat.islnk
              - apps_dns_hosts_stat.stat.uid == 0
              - apps_dns_hosts_stat.stat.mode == '0644'
              - apps_dns_hosts_stat.stat.size < 65536

        - name: Read the hosts file only into memory
          ansible.builtin.slurp:
            src: /etc/hosts
          register: apps_dns_hosts
          no_log: true

        - name: Select only active Grafana overrides
          ansible.builtin.set_fact:
            apps_dns_grafana_hosts_lines: >-
              {{ (apps_dns_hosts.content | b64decode).splitlines() |
              reject('match', '^\s*#') |
              select('search', '(^|\s)grafana\.apps\.internal(\s|$)') | list }}
          no_log: true

        - name: Refuse modifying an unexpected override or a line without other aliases
          ansible.builtin.assert:
            that:
              - apps_dns_grafana_hosts_lines | length <= 1
              - >-
                apps_dns_grafana_hosts_lines | length == 0 or
                (apps_dns_grafana_hosts_lines[0].split()[0] == '192.168.1.1' and
                apps_dns_grafana_hosts_lines[0].split('#')[0].split() | length > 2)
          no_log: true

        - name: Verify Grafana resolves correctly through application DNS first
          ansible.builtin.command:
            argv: >-
              {{ ['/usr/bin/dig', '@' ~ apps_dns_site.listen_ipv4,
              'grafana.apps.internal.', 'A', '+short', '+time=2', '+tries=1'] + item }}
          changed_when: false
          register: apps_dns_grafana_direct
          failed_when: >-
            apps_dns_grafana_direct.rc != 0 or
            apps_dns_grafana_direct.stdout != apps_dns_site.records.grafana
          loop: [[], ['+tcp']]

        - name: Remove the exact Grafana alias and preserve every other host mapping
          ansible.builtin.replace:
            path: /etc/hosts
            regexp: >-
              ^([ \t]*192\.168\.1\.1[ \t]+(?:[^#\n]*?[ \t]+)?)grafana\.apps\.internal(?=[ \t]|$)[ \t]*
            replace: '\1'
            backup: true
          become: true

        - name: Verify the normal macOS resolver now reaches the shared gateway
          ansible.builtin.command:
            argv: [/usr/bin/dscacheutil, '-q', host, '-a', name, grafana.apps.internal]
          changed_when: false
          register: apps_dns_grafana_system
          until: >-
            (apps_dns_grafana_system.stdout_lines |
            select('equalto', 'ip_address: ' ~ apps_dns_site.records.grafana) | list | length) > 0
          retries: 10
          delay: 3
