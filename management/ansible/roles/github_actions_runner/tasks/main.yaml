---
- name: Detect the Debian userspace architecture
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  changed_when: false
  register: github_actions_runner_userspace_architecture

- name: Require supported runner and tool architectures
  ansible.builtin.assert:
    that:
      - >-
        github_actions_runner_userspace_architecture.stdout in
        github_actions_runner_runtime_artifacts
      - ansible_facts['architecture'] in github_actions_runner_tool_artifacts
    fail_msg: >-
      Unsupported architecture combination: userspace
      {{ github_actions_runner_userspace_architecture.stdout }}, kernel
      {{ ansible_facts['architecture'] }}.

- name: Require a supported Debian runtime dependency set
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts['distribution'] in
        github_actions_runner_runtime_dependencies_by_release
      - >-
        ansible_facts['distribution_major_version'] in
        github_actions_runner_runtime_dependencies_by_release[
        ansible_facts['distribution']]
    fail_msg: >-
      No pinned GitHub Actions runner dependency set exists for
      {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_major_version'] }}.

- name: Select checksummed artifacts for the Pi architecture
  ansible.builtin.set_fact:
    github_actions_runner_runtime_artifact: >-
      {{ github_actions_runner_runtime_artifacts[
      github_actions_runner_userspace_architecture.stdout] }}
    github_actions_runner_tool_artifact: >-
      {{ github_actions_runner_tool_artifacts[
      ansible_facts['architecture']] }}

- name: Build the architecture-specific artifact names
  ansible.builtin.set_fact:
    github_actions_runner_archive_name: >-
      actions-runner-linux-{{ github_actions_runner_runtime_artifact.runner_arch
      }}-{{ github_actions_runner_version }}.tar.gz
    github_actions_runner_install_directory: >-
      {{ github_actions_runner_install_root }}/{{ github_actions_runner_version
      }}-{{ github_actions_runner_runtime_artifact.runner_arch }}
    github_actions_runner_tofu_package_name: >-
      tofu_{{ github_actions_runner_tofu_version
      }}_{{ github_actions_runner_tool_artifact.tofu_arch }}.deb

- name: Install runner runtime dependencies
  ansible.builtin.apt:
    name: >-
      {{ github_actions_runner_runtime_dependencies_common
      + github_actions_runner_runtime_dependencies_by_release[
      ansible_facts['distribution']][
      ansible_facts['distribution_major_version']] }}
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Identify the active NetworkManager connection
  ansible.builtin.command:
    argv:
      - nmcli
      - --get-values
      - GENERAL.CONNECTION
      - device
      - show
      - "{{ ansible_facts['default_ipv4']['interface'] }}"
  changed_when: false
  register: github_actions_runner_network_connection

- name: Read the active connection DNS configuration
  ansible.builtin.command:
    argv:
      - nmcli
      - --terse
      - --get-values
      - ipv4.ignore-auto-dns,ipv4.dns,ipv6.ignore-auto-dns
      - connection
      - show
      - "{{ github_actions_runner_network_connection.stdout }}"
  changed_when: false
  register: github_actions_runner_dns_configuration

- name: Configure reliable DNS for deployment tooling
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ github_actions_runner_network_connection.stdout }}"
      - ipv4.ignore-auto-dns
      - "yes"
      - ipv4.dns
      - "{{ github_actions_runner_dns_servers | join(',') }}"
      - ipv6.ignore-auto-dns
      - "yes"
  when: >-
    github_actions_runner_dns_configuration.stdout_lines !=
    ['yes', github_actions_runner_dns_servers | join(','), 'yes']
  changed_when: true
  notify: Reapply NetworkManager connection

- name: Create the dedicated runner group
  ansible.builtin.group:
    name: "{{ github_actions_runner_group }}"
    system: true

- name: Create the dedicated runner account
  ansible.builtin.user:
    name: "{{ github_actions_runner_user }}"
    group: "{{ github_actions_runner_group }}"
    home: /var/lib/github-runner
    shell: /bin/bash
    create_home: true
    system: true

- name: Create runner-owned runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ github_actions_runner_user }}"
    group: "{{ github_actions_runner_group }}"
    mode: "0700"
  loop:
    - "{{ github_actions_runner_work_directory }}"
    - /var/lib/github-runner/runtime

- name: Create the versioned runner installation directory
  ansible.builtin.file:
    path: "{{ github_actions_runner_install_directory }}"
    state: directory
    owner: "{{ github_actions_runner_user }}"
    group: "{{ github_actions_runner_group }}"
    mode: "0755"

- name: Download the checksummed GitHub Actions runner
  ansible.builtin.get_url:
    url: >-
      https://github.com/actions/runner/releases/download/v{{
      github_actions_runner_version }}/{{ github_actions_runner_archive_name }}
    dest: "/var/cache/{{ github_actions_runner_archive_name }}"
    checksum: "sha256:{{ github_actions_runner_runtime_artifact.runner_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Extract the pinned GitHub Actions runner
  ansible.builtin.unarchive:
    src: "/var/cache/{{ github_actions_runner_archive_name }}"
    dest: "{{ github_actions_runner_install_directory }}"
    remote_src: true
    owner: "{{ github_actions_runner_user }}"
    group: "{{ github_actions_runner_group }}"
    creates: >-
      {{ github_actions_runner_install_directory }}/bin/Runner.Listener

- name: Point current at the pinned runner release
  ansible.builtin.file:
    src: "{{ github_actions_runner_install_directory }}"
    dest: "{{ github_actions_runner_install_root }}/current"
    state: link
    owner: root
    group: root
    force: true
    follow: false

- name: Download the checksummed OpenTofu package
  ansible.builtin.get_url:
    url: >-
      https://github.com/opentofu/opentofu/releases/download/v{{
      github_actions_runner_tofu_version }}/{{
      github_actions_runner_tofu_package_name }}
    dest: "/var/cache/{{ github_actions_runner_tofu_package_name }}"
    checksum: "sha256:{{ github_actions_runner_tool_artifact.tofu_deb_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Install the pinned OpenTofu package
  ansible.builtin.apt:
    deb: "/var/cache/{{ github_actions_runner_tofu_package_name }}"
    state: present

- name: Install checksummed kubectl matching the cluster minor
  ansible.builtin.get_url:
    url: >-
      https://dl.k8s.io/release/v{{ github_actions_runner_kubectl_version
      }}/bin/linux/{{ github_actions_runner_tool_artifact.kubectl_arch }}/kubectl
    dest: /usr/local/bin/kubectl
    checksum: "sha256:{{ github_actions_runner_tool_artifact.kubectl_sha256 }}"
    owner: root
    group: root
    mode: "0755"

- name: Check whether the runner is registered
  ansible.builtin.stat:
    path: "{{ github_actions_runner_install_root }}/current/.runner"
  register: github_actions_runner_registration

- name: Record the intentionally manual registration boundary
  ansible.builtin.copy:
    dest: /etc/homelab-runner-registration-required
    owner: root
    group: root
    mode: "0644"
    content: |
      The runner binaries and toolchain are installed, but this host is not
      registered automatically. Register it only with the private
      nunoferna/talos-homelab-gitops repository by following
      docs/rpi-actions-runner.md in the public foundation repository.
  when: not github_actions_runner_registration.stat.exists

- name: Remove the registration marker after registration
  ansible.builtin.file:
    path: /etc/homelab-runner-registration-required
    state: absent
  when: github_actions_runner_registration.stat.exists

- name: Verify the pinned OpenTofu runtime
  ansible.builtin.command:
    cmd: tofu version
  changed_when: false
  register: github_actions_runner_tofu_version_output

- name: Require the expected OpenTofu version
  ansible.builtin.assert:
    that:
      - >-
        ('OpenTofu v' ~ github_actions_runner_tofu_version) in
        github_actions_runner_tofu_version_output.stdout

- name: Verify the pinned kubectl client
  ansible.builtin.command:
    cmd: kubectl version --client
  changed_when: false
