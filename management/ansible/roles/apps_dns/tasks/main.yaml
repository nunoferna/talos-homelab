---
- name: Validate the bounded DNS operation and site configuration
  ansible.builtin.assert:
    that:
      - apps_dns_operation in ['preview', 'deploy', 'stop']
      - >-
        (apps_dns_site.keys() | list | sort) ==
        ['allowed_clients', 'domain', 'listen_ipv4', 'records', 'serial']
      - apps_dns_site.domain == 'apps.internal'
      - apps_dns_site.listen_ipv4 == ansible_host
      - apps_dns_site.listen_ipv4 in ansible_facts['all_ipv4_addresses']
      - ansible_facts['distribution'] == 'Debian'
      - ansible_facts['architecture'] == 'aarch64'
      - apps_dns_site.allowed_clients | length > 0
      - apps_dns_site.records is mapping
      - "'keycloak' in apps_dns_site.records"
      - (apps_dns_site.serial | int) > 0
      - (apps_dns_site.serial | int) <= 4294967295

- name: Validate record labels and IPv4 values before templating
  ansible.builtin.assert:
    that:
      - item.key is match('^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$')
      - item.key != 'ns'
      - item.value is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
      - (item.value.split('.') | map('int') | max) <= 255
  loop: "{{ apps_dns_site.records | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Validate IPv4 client networks before templating
  ansible.builtin.assert:
    that:
      - item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$')
      - (item.split('/')[0].split('.') | map('int') | max) <= 255
      - item != '0.0.0.0/0'
  loop: "{{ apps_dns_site.allowed_clients }}"

- name: Verify the Debian binary architecture
  ansible.builtin.command:
    argv: [dpkg, --print-architecture]
  changed_when: false
  check_mode: false
  register: apps_dns_architecture

- name: Require the checksummed ARM64 build
  ansible.builtin.assert:
    that: [apps_dns_architecture.stdout == 'arm64']

- name: Inspect the named service without modifying it
  ansible.builtin.command:
    argv: [systemctl, show, homelab-apps-dns.service, --property=ActiveState, --value]
  changed_when: false
  failed_when: false
  check_mode: false
  register: apps_dns_active

- name: Inspect existing DNS listeners
  ansible.builtin.command:
    argv: [ss, '-H', '-lunt', 'sport = :53']
  changed_when: false
  check_mode: false
  register: apps_dns_listeners

- name: Refuse deployment over another DNS listener
  ansible.builtin.assert:
    that:
      - apps_dns_listeners.stdout | length == 0 or apps_dns_active.stdout == 'active'
    fail_msg: Review the existing port 53 listener before deploying this dedicated service.
  when: apps_dns_operation == 'deploy'

- name: Report the read-only preview
  ansible.builtin.debug:
    msg: >-
      Operation {{ apps_dns_operation }}; CoreDNS {{ apps_dns_version }};
      authoritative zone {{ apps_dns_site.domain }} on {{ apps_dns_site.listen_ipv4 }}:53.
      No recursive forwarding, router/DHCP changes or cluster DNS changes.
      Preview does not install packages, create files, or start a service.

- name: Render all deployment templates in memory before privileged work
  ansible.builtin.set_fact:
    apps_dns_rendered_corefile: "{{ lookup('ansible.builtin.template', 'Corefile.j2') }}"
    apps_dns_rendered_zone: "{{ lookup('ansible.builtin.template', 'apps.internal.zone.j2') }}"
    apps_dns_rendered_unit: "{{ lookup('ansible.builtin.template', 'homelab-apps-dns.service.j2') }}"

- name: Preserve the authoritative-only and address-bound service boundary
  ansible.builtin.assert:
    that:
      - "'forward ' not in apps_dns_rendered_corefile"
      - "('bind ' ~ apps_dns_site.listen_ipv4) in apps_dns_rendered_corefile"
      - "'block' in apps_dns_rendered_corefile"
      - "'ProtectHome=true' in apps_dns_rendered_unit"

- name: Install or update only after an explicit deploy operation
  when: apps_dns_operation == 'deploy'
  become: true
  block:
    - name: Reject check mode for a real deployment
      ansible.builtin.assert:
        that: [not ansible_check_mode]

    - name: Install native DNS query tools
      ansible.builtin.apt:
        name: bind9-dnsutils
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the dedicated unprivileged service account
      ansible.builtin.user:
        name: "{{ apps_dns_user }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create root-owned installation and configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "{{ apps_dns_install_directory }}"
        - "{{ apps_dns_configuration_directory }}"
        - /var/cache/homelab-apps-dns

    - name: Download the pinned upstream binary archive
      ansible.builtin.get_url:
        url: >-
          https://github.com/coredns/coredns/releases/download/v{{ apps_dns_version
          }}/coredns_{{ apps_dns_version }}_linux_arm64.tgz
        dest: "/var/cache/homelab-apps-dns/coredns-{{ apps_dns_version }}.tgz"
        checksum: "sha256:{{ apps_dns_archive_sha256 }}"
        owner: root
        group: root
        mode: '0644'

    - name: Extract the verified binary into its versioned directory
      ansible.builtin.unarchive:
        src: "/var/cache/homelab-apps-dns/coredns-{{ apps_dns_version }}.tgz"
        dest: "{{ apps_dns_install_directory }}"
        remote_src: true
        owner: root
        group: root
        mode: '0755'
        creates: "{{ apps_dns_install_directory }}/coredns"

    - name: Render the authoritative Corefile and zone
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ apps_dns_configuration_directory }}/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop: [Corefile, apps.internal.zone]
      notify: Restart homelab apps DNS

    - name: Render the sandboxed service unit
      ansible.builtin.template:
        src: homelab-apps-dns.service.j2
        dest: /etc/systemd/system/homelab-apps-dns.service
        owner: root
        group: root
        mode: '0644'
      notify: Restart homelab apps DNS

    - name: Activate reviewed service and configuration updates
      ansible.builtin.meta: flush_handlers

    - name: Ensure the dedicated service is enabled and running
      ansible.builtin.systemd_service:
        name: "{{ apps_dns_service }}"
        daemon_reload: true
        enabled: true
        state: started

    - name: Verify the published application address over UDP and TCP
      ansible.builtin.command:
        argv: >-
          {{ ['dig', '@' ~ apps_dns_site.listen_ipv4,
          'keycloak.' ~ apps_dns_site.domain ~ '.', 'A', '+short', '+time=2', '+tries=1'] + item }}
      changed_when: false
      register: apps_dns_query
      until: apps_dns_query.rc == 0 and apps_dns_query.stdout == apps_dns_site.records.keycloak
      retries: 5
      delay: 2
      loop: [[], ['+tcp']]

- name: Stop only the dedicated service after explicit rollback approval
  ansible.builtin.systemd_service:
    name: "{{ apps_dns_service }}"
    enabled: false
    state: stopped
  become: true
  when: apps_dns_operation == 'stop'
